# OpenTelemetry Collector (contrib / Google-built) on GCP: spans -> Cloud Trace, metrics -> Cloud Monitoring.
# The framework tokenises spans in-process; the transform processor is defence in depth.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}

processors:
  batch: {}
  resourcedetection: {detectors: [gcp]}
  transform/mask_pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)+", "[EMAIL]")
          - replace_all_patterns(attributes, "value", "(\\+91[\\- ]?)?[6-9][0-9]{4}[\\- ]?[0-9]{5}", "[PHONE]")
          - replace_all_patterns(attributes, "value", "[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}", "[AADHAAR]")
          - replace_all_patterns(attributes, "value", "[A-Z]{3}[ABCFGHLJPT][A-Z][0-9]{4}[A-Z]", "[PAN]")

exporters:
  googlecloud:
    project: ${env:GOOGLE_CLOUD_PROJECT}
  googlemanagedprometheus: {}

service:
  pipelines:
    traces: {receivers: [otlp], processors: [resourcedetection, transform/mask_pii, batch], exporters: [googlecloud]}
    metrics: {receivers: [otlp], processors: [resourcedetection, batch], exporters: [googlemanagedprometheus]}
