# Legal rules for Data Principal rights requests under India's DPDP Act 2023 and DPDP Rules 2025.
#
# An engineering reading of the official text, NOT legal advice. Have counsel review it, record the
# review in `reviewed`, and keep your own copy (rights.rule_sets_dir) if you change anything.
# Every case records the rule-set id, version and a SHA-256 of the effective rules (after your
# overrides), so later changes never rewrite how an earlier case was judged.
#
# respond_within_days: the deadline the framework sets on a new case (calendar days).
# max_days: an upper limit. `prescribed: true` means the limit is in the law and overrides above it
#           are refused; `prescribed: false` means it is this framework's conservative default and
#           overrides above it produce a check-config warning.
id: dpdp-in
version: "2025.11-3"   # -2 (18 Nov 2026): breach section (Rule 7); -3 (18 Nov 2026): Consent Managers, children
title: India, Digital Personal Data Protection Act 2023 and DPDP Rules 2025
effective_from: 2025-11-13
commencement: 2027-05-13          # rights provisions (Act ss.11-14, Rules r.14) apply from this date
sources:
  - "DPDP Act 2023 (No. 22 of 2023), Chapter III"
  - "DPDP Rules 2025, G.S.R. 846(E), 13 November 2025, rules 4, 7, 10-12 and 14, First and Fourth Schedules"
reviewed: null                    # e.g. "Counsel X, 2027-03-01, memo LGL-221"

publication:                      # Rules r.14(1)
  basis: "Rules r.14(1)"
  text: >-
    Publish prominently on the website, the app, or both, how a Data Principal makes a request to exercise
    these rights, and any identifier (customer number, username, policy number) needed to identify them.

requests:
  access:
    basis: "Act s.11; Rules r.14(1)"
    summary: A summary of the personal data processed and the processing activities, the other Data Fiduciaries and Data Processors it was shared with and what was shared.
    respond_within_days: 30
    max_days: 90
    prescribed: false
    requesters: [principal, nominee]
    review_by_default: true
    notes: >-
      s.11(1) applies to data processed on the basis of consent or a voluntary provision under s.7(a).
      s.11(2): sharing with Data Fiduciaries authorised by law for preventing, detecting or investigating
      offences need not be disclosed (mark such recipients exempt_from_access).
  correction:
    basis: "Act s.12(1)-(2)"
    summary: Correct inaccurate or misleading personal data, complete incomplete data, update data.
    respond_within_days: 30
    max_days: 90
    prescribed: false
    requesters: [principal, nominee]
    review_by_default: true
    notes: The Data Fiduciary decides whether the correction is warranted; a rejection needs a reason.
  erasure:
    basis: "Act s.12(3), s.8(7)"
    summary: Erase personal data unless retention is necessary for the purpose or required by law.
    respond_within_days: 30
    max_days: 90
    prescribed: false
    requesters: [principal, nominee]
    review_by_default: false      # erasure cases are signed off through the evidence case log
  withdrawal:
    basis: "Act s.6(4)-(6)"
    summary: Withdraw consent for a purpose, as easily as it was given; processing for it stops.
    respond_within_days: 30
    max_days: 90
    prescribed: false
    requesters: [principal, nominee]
    review_by_default: false
  nomination:
    basis: "Act s.14; Rules r.14(4)"
    summary: Nominate one or more individuals to exercise these rights in the event of death or incapacity.
    respond_within_days: 7
    max_days: 30
    prescribed: false
    requesters: [principal]
    review_by_default: false
    notes: Incapacity means inability to exercise the rights due to unsoundness of mind or infirmity of body (s.14(2)).
  nominee_invocation:
    basis: "Act s.14"
    summary: A nominee asks to act for the Data Principal after death or incapacity.
    respond_within_days: 15
    max_days: 30
    prescribed: false
    requesters: [nominee]
    review_by_default: true
  grievance:
    basis: "Act s.13; Rules r.14(3)"
    summary: A complaint about how personal data was handled or a request was dealt with.
    respond_within_days: 30
    max_days: 90
    prescribed: true              # r.14(3): respond within the published period, not exceeding ninety days
    requesters: [principal, nominee]
    review_by_default: false
    notes: >-
      Publish the response period. s.13(3): the Data Principal must exhaust this before approaching the
      Data Protection Board of India.

board_escalation: >-
  If you are not satisfied with our response to your grievance, you may complain to the Data Protection
  Board of India (DPDP Act s.13(3)), after using this grievance process.

# Personal data breach (Act s.8(6), Rules r.7). Used by `dpdp-rights breach assess` for deadlines and for the
# headings of the draft intimations; the drafts are for the DPO to complete, not to send unreviewed.
breach:
  basis: "Act s.8(6); Rules r.7"
  commencement: 2027-05-13
  threshold: none                 # every personal data breach is intimated; there is no risk threshold
  principals:
    basis: "Rules r.7(1)(a)"
    when: without delay           # to each affected Data Principal, through their account or registered contact
    contents:
      - description of the breach, including its nature, extent and the timing and location of its occurrence
      - the consequences relevant to the Data Principal that are likely to arise from the breach
      - the measures implemented and being implemented by the Data Fiduciary to mitigate any risk
      - the safety measures the Data Principal may take to protect her interests
      - business contact information of a person able to respond on behalf of the Data Fiduciary to queries
  board_initial:
    basis: "Rules r.7(2)(a)"
    when: without delay
    contents:
      - description of the breach, including its nature, extent, timing and location of occurrence
      - the likely impact
  board_detailed:
    basis: "Rules r.7(2)(b)"
    within_hours: 72              # of becoming aware of the breach
    extendable: true              # the Board may allow a longer period on a written request
    contents:
      - updated and detailed information about the description of the breach
      - the broad facts related to the events, circumstances and reasons leading to the breach
      - measures implemented or proposed to mitigate the risk
      - any findings regarding the person who caused the breach
      - remedial measures taken to prevent recurrence
      - a report on the intimations given to affected Data Principals

consent_managers:
  basis: "Act s.6(7)-(9); Rules r.4 and First Schedule"
  commencement: 2026-11-13        # Rule 4 and s.6(9) came into force one year after publication
  notes: >-
    A Data Principal may give, manage, review and withdraw consent through a Consent Manager registered with the
    Board. The Consent Manager keeps its own record of consents given, denied and withdrawn, the notices with them
    and the sharing of data, for at least seven years (First Schedule, Part B). The Data Fiduciary still has to be
    able to prove notice and consent (s.6(10)), so the framework keeps its own signed history as well. The Board
    has not published an interoperability standard; the built-in schema is provisional.
  record_retention_years_min: 7   # the Consent Manager's obligation, recorded here for reference

children:
  basis: "Act s.9; Rules r.10-12 and Fourth Schedule"
  commencement: 2027-05-13
  age_of_majority: 18             # Act s.2(f): a child is an individual under eighteen
  verifiable_consent: >-
    Before processing a child's personal data, obtain the verifiable consent of a parent, and check that the person
    who identifies as the parent is an identifiable adult (r.10). For a person with disability who has a lawful
    guardian, check the guardian was appointed under the applicable law (r.11).
  parent_methods:                 # Rules r.10(1)
    fiduciary_records: "r.10(1)(a): reliable details of identity and age already available with the Data Fiduciary"
    voluntary_details: "r.10(1)(b): identity and age details voluntarily provided"
    virtual_token: "r.10(1)(b): a virtual token mapped to those details, issued by an entity entrusted by law or the Government (e.g. through a Digital Locker service provider)"
  guardian_methods:               # Rules r.11; RPwD Act 2016 or National Trust Act 1999
    court: "appointed by a court of law"
    designated_authority: "appointed by a designated authority"
    local_level_committee: "appointed by a local level committee"
  restricted: "Act s.9(3): no tracking, behavioural monitoring or targeted advertising directed at children"
  detrimental_effect: "Act s.9(2): no processing likely to cause a detrimental effect on the well-being of a child (not exempted by r.12)"
  exemptions:                     # Rules r.12: s.9(1) and s.9(3) do not apply, subject to the condition
    part_a.clinical_establishment:
      text: "Clinical establishment, mental health establishment or healthcare professional"
      condition: "only for providing health services to the child, to the extent necessary to protect her health"
    part_a.allied_healthcare:
      text: "Allied healthcare professional"
      condition: "only for supporting a treatment and referral plan recommended by a healthcare professional, to the extent necessary to protect her health"
    part_a.educational_institution:
      text: "Educational institution"
      condition: "only for tracking and behavioural monitoring for its educational activities, or for the safety of children enrolled with it"
    part_a.creche:
      text: "Individual in whose care infants and children in a creche or child day care centre are entrusted"
      condition: "only for tracking and behavioural monitoring for the safety of children entrusted to them"
    part_a.child_transport:
      text: "Data Fiduciary engaged by an educational institution, creche or child care centre to transport enrolled children"
      condition: "only for tracking the location of the children, for their safety, during travel to and from it"
    part_b.legal_function:
      text: "Exercise of a power, performance of a function or discharge of a duty in the interests of a child, under a law in force in India"
      condition: "only to the extent necessary for it"
    part_b.subsidy_or_benefit:
      text: "Provision or issuance of a subsidy, benefit, service, certificate, licence or permit in the interests of a child under s.7(b)"
      condition: "only to the extent necessary for it"
    part_b.email_account:
      text: "Creation of a user account for communicating by email"
      condition: "only to the extent necessary for creating the account, and its use is limited to email"
    part_b.realtime_location:
      text: "Determining the real-time location of a child"
      condition: "only for tracking in the interest of her safety, protection or security"
    part_b.harm_prevention:
      text: "Ensuring that information, a service or an advertisement likely to cause a detrimental effect on the well-being of a child is not accessible to her"
      condition: "only to the extent necessary for it"
    part_b.age_confirmation:
      text: "Confirming that the Data Principal is not a child, and observing the due diligence under r.10"
      condition: "only to the extent necessary for it"
