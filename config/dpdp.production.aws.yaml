  #   options: {region: "${AWS_REGION}", log_group_names: [aws/spans, "/aws/bedrock-agentcore/runtimes/${AGENT_RUNTIME_ID}-DEFAULT"]}
  # - name: kb
  #   type: aws_bedrock_kb
  #   options: {knowledge_base_id: "${KB_ID}", data_source_id: "${KB_DATA_SOURCE_ID}", region: "${AWS_REGION}"}
  # - name: transcripts
