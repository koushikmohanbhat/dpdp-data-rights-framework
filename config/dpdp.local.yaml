# Offline configuration: no cloud accounts or API keys needed.
# Used by the demo (examples/support_copilot) and tests.
tenant: demo

provider:
  type: ${DPDP_PROVIDER:-echo}     # echo | openai | bedrock | vertex
  model: ${DPDP_MODEL:-echo}

pii:
  detectors: [regex]

vault:
  key_wrapper: local
  storage: sql
  local_master_key_path: .dpdp/master.key

lineage:
  url: sqlite:///.dpdp/lineage.db

purposes:
  - id: support_resolution
    description: Resolve the customer's support ticket
  - id: analytics
    description: Aggregate service-quality analytics
  - id: model_evaluation
    description: Evaluate assistant quality using real conversations
  - id: kyc_regulatory
    description: KYC records
    legal_basis: legitimate_use
    legal_hold_basis: "Retention required by an applicable law (example: RBI KYC Master Direction / PMLA record keeping)"

connectors:
  - name: tickets
    type: sql_table
    options: {url: "sqlite:///.dpdp/app.db", table: tickets, id_column: id, content_column: body, principal_column: principal_id}
  - name: summaries
    type: sql_table
    options: {url: "sqlite:///.dpdp/app.db", table: summaries, id_column: id, content_column: body, kind: summary}
  - name: vectors
    type: sql_table
    options: {url: "sqlite:///.dpdp/app.db", table: chunks, id_column: id, content_column: chunk, kind: embedding}
  - name: semantic_cache
    type: sql_table
    options: {url: "sqlite:///.dpdp/app.db", table: cache, id_column: id, content_column: answer, kind: cache_entry}
  - name: eval_set
    type: jsonl_dataset
    options: {path: .dpdp/evals/support_golden.jsonl, id_field: id, kind: eval_row}
  - name: app_log
    type: log_file
    options: {path: .dpdp/app.log}

policy:
  default_action: delete
  aggregate_k_threshold: 5        # demo value; use >= 10 in production
  sla_days: 30
  rules:
    - kind: eval_row
      action: delete
      reason: Eval rows are replaceable; never keep personal data in golden sets
