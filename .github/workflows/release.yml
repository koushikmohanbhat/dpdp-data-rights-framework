name: release
on:
  push: {tags: ["v*"]}
permissions: {contents: write, id-token: write, attestations: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install build cyclonedx-bom pip-audit pyyaml
      - run: python -m build
      - name: Release gate - dependency audit of the built wheel, every production profile
        run: python scripts/audit_gate.py --target "$(ls dist/*.whl)" --pins-dir audit-pins
      - name: SBOM per profile, from exactly the pins the gate audited (not this build environment)
        run: |
          for pins in audit-pins/*.txt; do
            profile=$(basename "$pins" .txt)
            cp "$pins" "dist/audit-pins-${profile}.txt"
            cyclonedx-py requirements "$pins" --pyproject pyproject.toml --mc-type library \
              --output-reproducible -o "dist/sbom-${profile}.cdx.json"
          done
      - name: Every profile has a non-empty pin file and a matching SBOM (else nothing is published)
        run: python scripts/check_release_artifacts.py --dist dist --policy .github/audit-policy.yml
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1.4.4
        with: {subject-path: "dist/*"}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env: {GH_TOKEN: "${{ github.token }}"}
