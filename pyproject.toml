[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai-dpdp-erasure-kit"
version = "0.1.0"
description = "Lineage-aware right-to-erasure (India DPDP Act) for LLM and agent systems on OpenAI, Anthropic, Amazon Bedrock and Google Vertex AI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6",
  "SQLAlchemy>=2.0",
  "cryptography>=42",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.60"]
aws = ["boto3>=1.40"]
gcp = [
  "google-genai>=1.0",
  "google-cloud-kms>=2.20",
  "google-cloud-firestore>=2.15",
  "google-cloud-logging>=3.10",
  "google-cloud-bigquery>=3.20",
  "google-cloud-aiplatform>=1.60",
  "google-cloud-dlp>=3.18",
  "google-cloud-storage>=2.14",
]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["genai-dpdp-erasure-kit[openai,anthropic,aws,gcp,redis,postgres,api]"]
dev = ["pytest>=8", "boto3>=1.40", "fastapi>=0.110", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
dpdp-erasure = "dpdp_erasure.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdp_erasure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 190
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E741", "B024"]
