[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpdp-data-rights-framework"
version = "0.2.0"
description = "Lineage-aware right-to-erasure (India DPDP Act) for LLM and agent systems on OpenAI, Anthropic, Amazon Bedrock and Google Vertex AI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6",
  "SQLAlchemy>=2.0",
  "cryptography>=42",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.60"]
aws = ["boto3>=1.40"]
gcp = [
  "google-genai>=1.0",
  "google-cloud-kms>=2.20",
  "google-cloud-firestore>=2.15",
  "google-cloud-logging>=3.10",
  "google-cloud-bigquery>=3.20",
  "google-cloud-aiplatform>=1.60",
  "google-cloud-dlp>=3.18",
  "google-cloud-storage>=2.14",
  "google-cloud-documentai>=2.20",
]
redis = ["redis>=5"]
documents = ["pypdf>=4"]
testing = ["pytest>=8"]                                    # conformance kit for connector and plug-in authors                                   # local text extraction from digital PDFs
presidio = ["presidio-analyzer>=2.2"]                      # plus a spaCy model, e.g. en_core_web_lg
indic-ner = ["transformers>=4.40", "torch>=2.2"]          # transformers_ner detector (e.g. ai4bharat/IndicNER)
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
auth = ["PyJWT[crypto]>=2.8"]
postgres = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "fastapi-offline>=1.7"]
all = ["dpdp-data-rights-framework[openai,anthropic,aws,gcp,redis,postgres,api,otel,auth]"]
dev = ["pytest>=8", "pypdf>=4", "reportlab>=4", "moto[s3,dynamodb]>=5", "fakeredis>=2", "boto3>=1.40", "fastapi>=0.110", "fastapi-offline>=1.7", "httpx>=0.27", "ruff>=0.5", "opentelemetry-sdk>=1.25", "PyJWT[crypto]>=2.8", "pip-audit>=2.7"]

[project.scripts]
dpdp-rights = "dpdp_rights.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdp_rights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: live tests against real cloud accounts (see docs/testing.md); skipped unless DPDP_IT_AWS=1"]

[tool.ruff]
line-length = 190
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E741", "B024"]
